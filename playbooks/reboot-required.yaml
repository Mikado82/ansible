- name: Check if a reboot is required and optionally perform reboot
  gather_facts: false
  hosts: all
  vars:
    perform_reboot: false

  tasks:
    - name: Check if the file reboot-requied exists
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Report if reboot is required
      ansible.builtin.debug:
        msg: "Reboot required"
      when: reboot_required_file.stat.exists

    - name: Perform reboot if required and requested
      become: true
      ansible.builtin.reboot:
      when: reboot_required_file.stat.exists and perform_reboot
