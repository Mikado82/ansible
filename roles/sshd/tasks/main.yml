---
- name: "Add OS-specific variables"
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ ansible_facts['os_family'] }}.yaml"
        - default.yaml
      paths:
        - 'vars'

- name: Check if /etc/ssh/sshd_config includes the files in sshd_config.d
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    state: absent
  check_mode: true
  changed_when: false
  register: sshd_include_line

- name: Assert the previously checked condition
  ansible.builtin.assert:
    that: sshd_include_line.found == 1
    fail_msg: >
      The /etc/ssh/sshd_config file does not include the config files in sshd_config.d!
      Please make sure to have an up-to-date OpenSSH server and the following line AT THE TOP of your sshd config:
      'Include /etc/ssh/sshd_config.d/*.conf'.
    quiet: true

- name: Create sshd conf file safely, avoid locking yourself out
  ansible.builtin.template:
    src: 50-secure-ssh.conf.j2
    dest: /etc/ssh/sshd_config.d/50-secure-ssh.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify:
    - restart-sshd

- name: Remove Ubuntu-generated conf file (50-cloud-init.conf)
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    state: absent
  notify:
    - restart-sshd

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers
