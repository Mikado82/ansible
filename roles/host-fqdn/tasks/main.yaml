- name: Gather facts
  ansible.builtin.setup:
  when: ansible_facts|default({}) == {}

- name: Assert that a domain is specified
  run_once: true
  delegate_to: localhost
  ansible.builtin.assert:
    that:
      - host_fqdn_domain is defined
      - host_fqdn_domain | length > 0
    fail_msg: "The 'host_fqdn_domain' variable must be defined and contain a valid domain name."
    quiet: true

# NOTE: Here, it is important to use "include_tasks" and NOT "import_tasks", because
# otherwise, it will always be evaluated with the default value of 'host_fqdn_method'.
- name: "Use the specified method to set the FQDN"
  ansible.builtin.include_tasks: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "edit-{{ host_fqdn_method }}.yaml"
        - unknown-method.yaml
      paths:
        - 'tasks'

- name: "Flush handlers"
  ansible.builtin.meta: flush_handlers
