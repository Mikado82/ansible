# List of dictionaries, each specifying a rule, described
# by the following properties, which correspond to the
# listed parameters of the community.general.ufw module:
#
#   rule:      rule: "allow", "deny", "limit", "reject". Ansible default: "allow"
#   proto:     proto: TCP/IP protocol. "any", "tcp", "udp", "ipv6", "esp", "ah", "gre", "igmp"
#   name:      name: Use profile located in /etc/ufw/applications.d
#   to:        to_ip: Destination IP address. UFW default: "any"
#   port:      to_port: Destination port
#   from:      from_ip: Source IP address. UFW default: "any"
#   from_port: from_port: Source port
#   route:     route: Apply the rule to routed/forwarded packets, UFW default: "false"
#   if_in:     interface_in: Input interface for the rule
#   if_out:    interface_out: Output interface for the rule
#   comment:   comment: Add a comment to the rule. Requires UFW version >=0.35
#   delete:    delete: Delete rule
#
# Note that as ufw manages its own state, simply removing
# a rule=allow task can leave those ports exposed.
# Instead, use delete=true.
#
# Instead of a list with only a single dictionary item in it,
# the dictionary can also be passed directly in this case.
ufw_rules:

# The source/target folders for app profile files
ufw_profiles_source_dir:
ufw_profiles_target_dir: /etc/ufw/applications.d

# List of profile files to copy
ufw_profiles_present:

# Options to automatically add a rule to open the SSH port,
# apply a rate limit, and limit the allowed source addresses
ufw_add_ssh_rule: false
ufw_ssh_limit: false
ufw_ssh_port: 22
# ufw_ssh_from:

# Enable/disable IPv6 rules. UFW default: true.
# If set to false, IPv6 connections are only
# accepted on the loopback device. WARNING:
# In this case, all IPv6 rules will be deleted!
# If not set, nothing will be changed.
# ufw_ipv6_enabled:

# Set default policies. UFW defaults:
#   DEFAULT_INPUT_POLICY: DROP
#   DEFAULT_OUTPUT_POLICY: ACCEPT
#   DEFAULT_FORWARD_POLICY: DROP
#   DEFAULT_APPLICATION_POLICY: SKIP
# If not set, nothing will be changed.
# ufw_default_input_policy:
# ufw_default_output_policy:
# ufw_default_forward_policy:
# ufw_default_application_policy:
