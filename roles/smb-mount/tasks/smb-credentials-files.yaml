# Make sure a password is provided when needed
- name: Make sure a password is provided when needed
  when: (item.state is not defined or item.state == 'present') and item.smb_password is not defined
  block:
    - name: Check if credentials file exists
      ansible.builtin.stat:
        path: "{{ credentials_file }}"
      register: credentials_file_stat

    - name: Fail if credentials file does not exist and no password is provided
      ansible.builtin.fail:
        msg: "A password must be provided when state is 'present' and the credentials file does not yet exist."
      when: not credentials_file_stat.stat.exists

# Create credentials file
- name: Create credentials file for SMB mounts
  when: (item.state is not defined or item.state == 'present') and item.smb_password is defined
  block:
    - name: Ensure the directory for the credentials file exists
      ansible.builtin.file:
        path: "{{ credentials_file | dirname }}"
        state: directory
        mode: '0600'

    - name: Create the actual credentials file
      ansible.builtin.copy:
        dest: "{{ credentials_file }}"
        content: |
          username={{ item.smb_username }}
          password={{ item.smb_password }}
        mode: '0600'
      no_log: true

# Remove credentials file
- name: Remove credentials file for SMB mounts
  ansible.builtin.file:
    path: "{{ credentials_file }}"
    state: absent
  when: item.state is defined and item.state == 'absent'
