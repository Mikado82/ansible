---
- name: Add distribution-specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
        - "{{ unattended_all_origins | ternary('all.yaml', 'NOT_EXISTENT') }}"
        - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_release'] }}.yaml"
        - "{{ ansible_facts['distribution'] }}.yaml"
      paths:
        - 'vars'

- name: Import the unattended upgrades role by hifis
  ansible.builtin.import_role:
    name: hifis.unattended_upgrades

- name: Import the daily upgrade time override tasks
  ansible.builtin.import_tasks: daily_upgrade_time_override.yaml
